openapi: 3.0.3
info:
  title: Merchant Payment Gateway API
  version: 2.0.0
  description: |
    Merchant-centric payment gateway (Bun + Drizzle + PostgreSQL).
    Amounts are integer smallest currency units (cents).
    Merchant APIs use per-merchant `X-API-Key`. Platform admin uses env `API_KEY`.
    `POST /merchants` is open registration. Charges require `Idempotency-Key` (UUID v4).
servers:
  - url: http://localhost:3000
tags:
  - name: System
  - name: Merchants
  - name: Transactions
  - name: Webhooks
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      responses:
        "200":
          description: OK
  /api/v1/merchants:
    get:
      tags: [Merchants]
      summary: List merchants (platform admin or dev)
      security: [{ ApiKeyAuth: [] }]
      responses:
        "200":
          description: Merchant list
    post:
      tags: [Merchants]
      summary: Register merchant (no API key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, webhook_url, phone_number, origin_header]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                webhook_url: { type: string, format: uri }
                phone_number: { type: string }
                origin_header: { type: string }
                ip_whitelist:
                  type: array
                  items: { type: string }
                api_key: { type: string }
                webhook_secret: { type: string }
      responses:
        "201":
          description: Created with api_key and webhook_secret
  /api/v1/merchants/{id}:
    get:
      tags: [Merchants]
      summary: Get merchant
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Merchant
    patch:
      tags: [Merchants]
      summary: Update merchant
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                webhook_url: { type: string }
                phone_number: { type: string }
                origin_header: { type: string }
                ip_whitelist:
                  type: array
                  items: { type: string }
                api_key: { type: string }
                webhook_secret: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Merchants]
      summary: Delete merchant (platform admin)
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
  /api/v1/transactions:
    get:
      tags: [Transactions]
      summary: List transactions (scoped to merchant key or filter by merchant_id as admin)
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: merchant_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, AUTHORIZED, CAPTURED, FAILED, REFUNDED]
        - name: from
          in: query
          description: Start date (inclusive), YYYY-MM-DD
          schema: { type: string, format: date }
        - name: to
          in: query
          description: End date (inclusive), YYYY-MM-DD
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        "200":
          description: Transaction list
    post:
      tags: [Transactions]
      summary: Create charge
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                merchant_id:
                  type: string
                  description: Required when using platform admin API key
                amount: { type: integer, minimum: 1 }
                currency:
                  type: string
                  enum: [USD, EUR, GBP, JPY, AED, SAR]
                description: { type: string }
      responses:
        "201":
          description: Created
  /api/v1/transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transaction
  /api/v1/transactions/{id}/status:
    patch:
      tags: [Transactions]
      summary: Update status (simulator)
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PENDING, AUTHORIZED, CAPTURED, FAILED, REFUNDED]
      responses:
        "200":
          description: Updated
  /api/v1/transactions/{id}/refund:
    post:
      tags: [Transactions]
      summary: Refund captured transaction
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Refunded
  /api/v1/webhook-deliveries:
    get:
      tags: [Webhooks]
      summary: List outbound webhook deliveries to merchants
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: merchant_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, DELIVERED, FAILED]
        - name: event
          in: query
          schema: { type: string }
        - name: transaction_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        "200":
          description: Delivery log
  /webhooks/processor:
    post:
      tags: [Webhooks]
      summary: Inbound processor webhook (HMAC — merchant secret from transaction)
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accepted
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
