services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment_gateway
    # Host 5436 avoids clashing with other Postgres instances on 5432
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_gateway"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
